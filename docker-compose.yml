services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca-nest-db
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: biblioteca-nest-app
    environment:
      DATABASE_URL: postgres://biblioteca:biblioteca@db:5432/biblioteca
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
